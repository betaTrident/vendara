name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?sslmode=disable
  PUBLIC_NEON_AUTH_URL: https://ci-auth.example.com/neondb/auth

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check (Biome)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Integration tests
        run: npm run test:integration
        env:
          DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}

      - name: Coverage
        run: npm run coverage

      - name: Production build
        run: npm run build

      - name: Verify PWA artifacts
        run: |
          set -euo pipefail
          if [ -d .vercel/output/static ]; then
            ls -la .vercel/output/static
            test -n "$(find .vercel/output/static -maxdepth 2 \( -name 'manifest.webmanifest' -o -name 'sw.js' -o -name 'workbox-*.js' \) -print -quit)"
          else
            echo "Expected Vercel static output at .vercel/output/static"
            exit 1
          fi

      - name: npm audit (high severity and above)
        run: npm audit --audit-level=high
        continue-on-error: true

  e2e:
    name: E2E (smoke)
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run Playwright smoke tests
        run: npm run test:e2e
        env:
          E2E_OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
          E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
